[package]
name = "unmoof"
version = "0.1.0"
edition = "2024"
description = "Remuxes HLS and DASH segments (fMP4, MPEG-TS, packed audio, subtitles) into one progressive MP4"
license = "MIT"
authors = ["RedMoth"]
repository = "https://github.com/LicaRedMoth/unmoof"
readme = "README.md"
keywords = ["hls", "dash", "mp4", "remux", "wasm"]
categories = ["multimedia::video", "multimedia::audio", "wasm"]
exclude = ["/tools", "/fuzz", "/wasm", "/examples/fuzz.rs"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "unmoof"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# For examples/fuzz.rs: fast, but with overflow checks and unwinding so failures can be caught.
[profile.fuzz]
inherits = "release"
panic = "unwind"
overflow-checks = true
debug-assertions = true
debug = "line-tables-only"
lto = false
codegen-units = 16
